<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @keyframes penguin-dance {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-14deg); }
      75% { transform: rotate(14deg); }
    }
  </style>
  <script src="./spark-face.js"></script>
</helmet>

<!-- SPARK: a small scroll companion — a penguin whose expression changes as
     you move through each labeled section (see spark-face.js), or simply
     stays happy on pages with no data-spark-section markers. Pinned to the
     viewport on the right; drifts down/up as you scroll and gives a little
     bounce. Round white belly, black back/head, orange feet and beak read
     clearly as "penguin" even at small size. Sits above a WhatsApp button. -->
<div ref="{{ angelRef }}" style="position:fixed; right:1.2vw; top:26vh; z-index:40; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);">
  <svg onClick="{{ onSparkClick }}" width="50" height="58" viewBox="0 0 80 94" style="display:block; overflow:visible; cursor:pointer; pointer-events:auto; filter:drop-shadow(0 4px 10px rgba(226,35,26,0.4));">
    <!-- feet -->
    <ellipse cx="28" cy="90" rx="9" ry="4" fill="#d4a017"></ellipse>
    <ellipse cx="52" cy="90" rx="9" ry="4" fill="#d4a017"></ellipse>
    <!-- body: black back/head silhouette -->
    <path d="M40 4
             C 58 4, 70 20, 70 42
             C 70 62, 64 76, 54 86
             C 48 90, 32 90, 26 86
             C 16 76, 10 62, 10 42
             C 10 20, 22 4, 40 4 Z" fill="#14161a"></path>
    <!-- white belly -->
    <path d="M40 22
             C 52 22, 59 34, 59 48
             C 59 64, 54 78, 46 84
             C 42 87, 38 87, 34 84
             C 26 78, 21 64, 21 48
             C 21 34, 28 22, 40 22 Z" fill="#f5f1ea"></path>
    <!-- wings -->
    <path d="M12 40 C 6 48, 4 60, 8 70 C 14 64, 17 54, 16 44 Z" fill="#14161a"></path>
    <path d="M68 40 C 74 48, 76 60, 72 70 C 66 64, 63 54, 64 44 Z" fill="#14161a"></path>
    <!-- beak -->
    <path d="M32 46 C 32 42, 36 40, 40 40 C 44 40, 48 42, 48 46 C 44 49, 36 49, 32 46 Z" fill="#d4a017"></path>
    <g ref="{{ eyeLRef }}">
      <sc-if value="{{ isMoodHappy }}" hint-placeholder-val="{{ true }}"><circle cx="33" cy="34" r="3.6" fill="#0b0908"></circle><circle cx="34.1" cy="32.9" r="1.1" fill="#f5f1ea"></circle></sc-if>
      <sc-if value="{{ isMoodExcited }}" hint-placeholder-val="{{ false }}"><circle cx="33" cy="33" r="4.6" fill="#0b0908"></circle><circle cx="34.4" cy="31.5" r="1.3" fill="#f5f1ea"></circle></sc-if>
      <sc-if value="{{ isMoodWink }}" hint-placeholder-val="{{ false }}"><path d="M28.5 34 Q33 30 37.5 34" stroke="#0b0908" stroke-width="2.4" fill="none" stroke-linecap="round"></path></sc-if>
      <sc-if value="{{ isMoodThinking }}" hint-placeholder-val="{{ false }}"><circle cx="33" cy="32.5" r="3.1" fill="#0b0908"></circle><circle cx="33.9" cy="31.4" r="0.9" fill="#f5f1ea"></circle></sc-if>
      <sc-if value="{{ isMoodLove }}" hint-placeholder-val="{{ false }}"><path d="M33 30 Q29.5 26.5 27 30 Q29.5 34 33 37.5 Q36.5 34 39 30 Q36.5 26.5 33 30 Z" fill="#f5f1ea"></path></sc-if>
    </g>
    <circle cx="47" cy="34" r="3.6" fill="#0b0908"></circle>
    <path d="{{ mouthD }}" fill="#ff6a52" stroke="none" opacity="{{ mouthOpacity }}"></path>
  </svg>
  <a href="https://wa.me/6590587338" target="_blank" rel="noopener" title="WhatsApp Us" style="pointer-events:auto; display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:#25d366; box-shadow:0 4px 10px rgba(0,0,0,0.35); flex-shrink:0;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#0b0908"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.44 9.9-9.9 0-2.64-1.03-5.12-2.9-6.99A9.82 9.82 0 0 0 12.04 2Zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.26-.29.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.66.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.1.19-.15.31-.29.48-.14.17-.3.37-.43.5-.14.14-.29.29-.12.57.17.29.75 1.24 1.62 2.01 1.11.99 2.05 1.3 2.34 1.44.29.14.46.12.63-.07.17-.19.72-.84.91-1.13.19-.29.39-.24.65-.14.26.1 1.67.79 1.96.93.29.14.48.22.55.34.07.12.07.7-.17 1.38Z"></path></svg>
  </a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 70, &quot;height&quot;: 90}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.angelRef = React.createRef();
    this.eyeLRef = React.createRef();
    this.state = { mood: 'happy' };
    this._currentTop = 26; // vh
    this._targetTop = 26;
    this._raf = null;
    this._mouseX = null;
    this._mouseY = null;
  }

  // Facial expression (mouth path + eye shape) lives in state, driven by a
  // callback the independent spark-face.js script calls when a labeled
  // section (data-spark-section) crosses viewport-center on the host page —
  // see that file's own comment for why detection lives there. On pages
  // with no such markers this simply stays 'happy'. Rendering the eye/mouth
  // through normal React state — instead of spark-face.js mutating that DOM
  // directly — keeps React and the real DOM in agreement, avoiding
  // reconciliation crashes when anything else on the page triggers a
  // re-render.
  EXPRESSIONS = {
    happy:    { mouthD: 'M28 50 a5 3.5 0 1 0 0.1 0', mouthOpacity: 0 },
    excited:  { mouthD: 'M28 50 a6 4 0 1 0 0.1 0', mouthOpacity: 0.55 },
    wink:     { mouthD: 'M28 50 a5 3.5 0 1 0 0.1 0', mouthOpacity: 0.3 },
    thinking: { mouthD: 'M28 50 a5 3.5 0 1 0 0.1 0', mouthOpacity: 0 },
    love:     { mouthD: 'M28 50 a6.5 4.5 0 1 0 0.1 0', mouthOpacity: 0.75 }
  };

  _dance() {
    const el = this.angelRef.current;
    const svgEl = el && el.querySelector('svg');
    if (!svgEl) return;
    // Pause the cursor-tilt tick from fighting the dance animation for its
    // duration, then hand control back cleanly.
    this._dancing = true;
    svgEl.style.animation = 'penguin-dance 0.6s ease-in-out 2';
    clearTimeout(this._danceTimeout);
    this._danceTimeout = setTimeout(() => {
      this._dancing = false;
      if (svgEl) svgEl.style.animation = '';
    }, 1200);
  }

  componentDidMount() {
    this._running = true;

    window.__sparkOnMood = (mood) => {
      if (this.EXPRESSIONS[mood] && mood !== this.state.mood) this.setState({ mood });
    };

    this._onScroll = () => {
      const y = window.scrollY || window.pageYOffset || 0;
      const doc = document.documentElement;
      const maxScroll = Math.max(1, doc.scrollHeight - window.innerHeight);
      const frac = Math.max(0, Math.min(1, y / maxScroll));
      // Keep the companion drifting within a comfortable vertical band as
      // the page scrolls, never colliding with the very top or bottom.
      this._targetTop = 20 + frac * 55;
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onScroll();

    this._onMouseMove = (e) => {
      this._mouseX = e.clientX;
      this._mouseY = e.clientY;
    };
    window.addEventListener('mousemove', this._onMouseMove, { passive: true });

    // Occasional blink for extra charm — a quick vertical squash of the eye
    // group, layered on top of whatever expression spark-face.js currently
    // has set (it only touches style.transform, spark-face.js only touches
    // this component's state, so the two never conflict).
    this._blinkInterval = setInterval(() => {
      const l = this.eyeLRef.current;
      if (!l) return;
      l.style.transform = 'scaleY(0.1)';
      l.style.transformOrigin = 'center';
      setTimeout(() => {
        if (l) l.style.transform = 'scaleY(1)';
      }, 140);
    }, 2600);

    // setInterval rather than requestAnimationFrame: rAF gets fully suspended
    // in some backgrounded/embedded preview contexts, silently freezing the
    // effect, whereas an interval keeps firing.
    this._raf = setInterval(() => {
      if (!this._running) return;
      this._currentTop += (this._targetTop - this._currentTop) * 0.08;
      const el = this.angelRef.current;
      if (el) el.style.top = this._currentTop.toFixed(2) + 'vh';

      // Gentle whole-face tilt toward the cursor (eyes keep their per-
      // expression shape rather than sliding independently). Skipped while
      // a click-triggered dance animation is playing so the two don't
      // fight over the same svg transform.
      if (!this._dancing && this._mouseX != null && el) {
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = this._mouseX - cx;
        const svgEl = el.querySelector('svg');
        if (svgEl) {
          const tilt = Math.max(-8, Math.min(8, dx / 40));
          svgEl.style.transform = 'rotate(' + tilt.toFixed(1) + 'deg)';
        }
      }
    }, 33);
  }

  componentWillUnmount() {
    this._running = false;
    if (this._raf) clearInterval(this._raf);
    if (this._blinkInterval) clearInterval(this._blinkInterval);
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
    if (this._onMouseMove) window.removeEventListener('mousemove', this._onMouseMove);
    if (this._danceTimeout) clearTimeout(this._danceTimeout);
    if (window.__sparkOnMood) window.__sparkOnMood = null;
  }

  renderVals() {
    const mood = this.state.mood || 'happy';
    const ex = this.EXPRESSIONS[mood] || this.EXPRESSIONS.happy;
    return {
      onSparkClick: () => this._dance(),
      angelRef: this.angelRef,
      eyeLRef: this.eyeLRef,
      isMoodHappy: mood === 'happy',
      isMoodExcited: mood === 'excited',
      isMoodWink: mood === 'wink',
      isMoodThinking: mood === 'thinking',
      isMoodLove: mood === 'love',
      mouthD: ex.mouthD,
      mouthOpacity: ex.mouthOpacity
    };
  }
}

</script>
</body>
</html>
